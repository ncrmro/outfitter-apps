name: App PR previews
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:
    inputs:
      pull_request:
        description: Reviewed pull request number (builds its current head)
        required: true
        type: number
permissions:
  contents: read
  pull-requests: write
jobs:
  previews:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && (github.event.action == 'closed' || (github.actor == 'ncrmro' && github.event.pull_request.user.login == 'ncrmro')))
    uses: ai-outfitter/apps/.github/workflows/preview.yml@34607bb23d7a134973c60cc6a5787fcc3d9f3874
    with:
      pull-request: ${{ fromJSON(format('{0}', github.event.pull_request.number || inputs.pull_request)) }}
      build-mode: toolchain
      trusted-build-actors: '["ncrmro"]'
      toolchain-sha: ${{ vars.OUTFITTER_TOOLCHAIN_SHA }}
    secrets:
      OUTFITTER_TOOLCHAIN_SSH_KEY: ${{ secrets.OUTFITTER_TOOLCHAIN_SSH_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
