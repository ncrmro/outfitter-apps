name: App toolchain
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Reviewed 40-character app repository commit SHA
        type: string
        required: true
permissions:
  contents: read
jobs:
  toolchain:
    uses: ai-outfitter/apps/.github/workflows/toolchain.yml@d76e0082c4dc4706b1f150ce2b1629693af73f4b
    with:
      source_sha: ${{ inputs.source_sha }}
    secrets:
      OUTFITTER_TOOLCHAIN_TOKEN: ${{ secrets.OUTFITTER_TOOLCHAIN_TOKEN }}
