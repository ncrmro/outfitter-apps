name: Check
on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: check-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  apps:
    uses: ai-outfitter/apps/.github/workflows/check.yml@ac0dddcb951210ddbb1a86c3fb559d52883dba19
    with:
      config-path: .outfitter/apps.json
      sdk-sha: ac0dddcb951210ddbb1a86c3fb559d52883dba19
  deploy:
    needs: apps
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.apps.outputs.has_apps == 'true' && vars.OUTFITTER_DEPLOY_ENABLED == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      apps: ${{ needs.apps.outputs.apps }}
