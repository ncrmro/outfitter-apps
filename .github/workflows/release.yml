    branches: [main]
permissions:
  contents: write
  issues: write
  pull-requests: write
jobs:
  release:
    uses: ai-outfitter/apps/.github/workflows/release.yml@5b00772ac934f67e65451b76eff551b2ef42271f
    secrets:
      release-token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
