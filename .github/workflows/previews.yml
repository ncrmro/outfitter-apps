name: App PR previews
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:
    inputs:
      pull_request:
        description: Reviewed pull request number (builds its current head)
        required: true
        type: number
permissions:
  contents: read
  pull-requests: write
jobs:
  previews:
    if: github.event_name == 'workflow_dispatch' || github.event.action == 'closed'
    uses: ai-outfitter/apps/.github/workflows/preview.yml@b8f6f3b07dbce1ab2996b0248f376ca3da7bbe6e
    with:
      pull-request: ${{ fromJSON(format('{0}', github.event.pull_request.number || inputs.pull_request)) }}
      build-mode: toolchain
      toolchain-sha: ${{ vars.OUTFITTER_TOOLCHAIN_SHA }}
    secrets:
      OUTFITTER_TOOLCHAIN_SSH_KEY: ${{ secrets.OUTFITTER_TOOLCHAIN_SSH_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
