name: App releases
on:
  push:
    branches: [main]
permissions:
  contents: write
  issues: write
  pull-requests: write
jobs:
  release:
    if: vars.OUTFITTER_RELEASES_ENABLED == 'true'
    uses: ai-outfitter/apps/.github/workflows/release.yml@d76e0082c4dc4706b1f150ce2b1629693af73f4b
    secrets:
      release-token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
