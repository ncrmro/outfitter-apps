name: Check
on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: check-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  apps:
    uses: ai-outfitter/apps/.github/workflows/check.yml@ca2922e739148effb8e366a39dd46f812ad1d348
    with:
      config-path: .outfitter/apps.json
