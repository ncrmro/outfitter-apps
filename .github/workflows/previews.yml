name: App PR previews
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:
    inputs:
      pull_request:
        description: Reviewed pull request number (builds its current head)
        required: true
        type: number
permissions:
  contents: read
  pull-requests: write
jobs:
  previews:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    uses: ai-outfitter/apps/.github/workflows/preview.yml@ca2922e739148effb8e366a39dd46f812ad1d348
    with:
      pull-request: ${{ fromJSON(format('{0}', github.event.pull_request.number || inputs.pull_request)) }}
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
