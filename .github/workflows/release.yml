name: App releases
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      releases:
        description: JSON array of existing releases to notify again
        required: true
        type: string
permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write
jobs:
  release:
    uses: ai-outfitter/apps/.github/workflows/release.yml@223e954a1b7a1cbdbb6bc6520de15f792b4d6590
    with:
      destination: ${{ vars.OUTFITTER_URL || 'https://ai-outfitter.com' }}
      releases: ${{ inputs.releases || '' }}
    secrets:
      release-token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
