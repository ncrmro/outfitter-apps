name: App toolchain
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Reviewed 40-character app repository commit SHA
        type: string
        required: true
permissions:
  contents: read
jobs:
  toolchain:
    uses: ai-outfitter/apps/.github/workflows/toolchain.yml@12f97d71314c70e7c974290958093f5a8cddd6a2
    with:
      source_sha: ${{ inputs.source_sha }}
    secrets:
      OUTFITTER_TOOLCHAIN_TOKEN: ${{ secrets.OUTFITTER_TOOLCHAIN_TOKEN }}
