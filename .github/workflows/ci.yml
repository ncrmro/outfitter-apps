name: Check

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      apps: ${{ steps.plan.outputs.apps }}
      has_apps: ${{ steps.plan.outputs.has_apps }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Find the last successful main pipeline
        if: github.event_name == 'push'
        id: baseline
        run: |
          base=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
            -f branch=main -f event=push -f status=success -f per_page=1 \
            --jq '.workflow_runs[0].head_sha // empty') || base=
          echo "sha=$base" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
      - id: plan
        run: npm run ci:plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || steps.baseline.outputs.sha }}
          HEAD_SHA: ${{ github.sha }}

  tooling:
    name: Workflow tooling tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test

  app-contract:
    name: Package contract (${{ matrix.app }})
    needs: plan
    if: needs.plan.outputs.has_apps == 'true'
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.plan.outputs.apps) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/apps.mjs check "$APP"
        env:
          APP: ${{ matrix.app }}

  check:
    name: CI gate
    if: always()
    needs: [plan, tooling, app-contract]
    runs-on: ubuntu-latest
    steps:
      - name: Require successful selected checks
        run: |
          test "$PLAN" = success
          test "$TOOLING" = success
          if [ "$HAS_APPS" = true ]; then test "$APPS" = success; fi
        env:
          PLAN: ${{ needs.plan.result }}
          TOOLING: ${{ needs.tooling.result }}
          APPS: ${{ needs.app-contract.result }}
          HAS_APPS: ${{ needs.plan.outputs.has_apps }}
      - name: State the validation boundary
        run: |
          echo 'Package contracts and workflow tooling passed. App runtime tests and builds require the private SDK toolchain; use the App toolchain workflow. This gate does not certify them.' >> "$GITHUB_STEP_SUMMARY"
          echo "Release automation enabled: ${RELEASES:-false}; deployment requests enabled: ${DEPLOY:-false}." >> "$GITHUB_STEP_SUMMARY"
        env:
          RELEASES: ${{ vars.OUTFITTER_RELEASES_ENABLED }}
          DEPLOY: ${{ vars.OUTFITTER_DEPLOY_ENABLED }}

  release:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.OUTFITTER_RELEASES_ENABLED == 'true'
    permissions:
      contents: write
      issues: write
      pull-requests: write
    uses: ./.github/workflows/release.yml
    secrets: inherit

  deploy:
    needs: [plan, check]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.plan.outputs.has_apps == 'true' && vars.OUTFITTER_DEPLOY_ENABLED == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      apps: ${{ needs.plan.outputs.apps }}
