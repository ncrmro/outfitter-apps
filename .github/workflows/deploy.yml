name: Deployment
on:
  workflow_call:
    inputs:
      apps:
        required: true
        type: string
permissions:
  contents: read
  id-token: write
jobs:
  deploy:
    uses: ai-outfitter/apps/.github/workflows/deploy.yml@d76e0082c4dc4706b1f150ce2b1629693af73f4b
    with:
      apps: ${{ inputs.apps }}
      destination: ${{ vars.OUTFITTER_URL || 'https://ai-outfitter.com' }}
      environment: outfitter
      runner: ${{ vars.OUTFITTER_DEPLOY_RUNNER || 'ubuntu-latest' }}
