name: Check
on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: check-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  apps:
    uses: ai-outfitter/apps/.github/workflows/check.yml@ca2922e739148effb8e366a39dd46f812ad1d348
    with:
      config-path: .outfitter/apps.json
  deploy:
    needs: apps
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.apps.outputs.has_apps == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ai-outfitter/apps/.github/workflows/deploy.yml@ca2922e739148effb8e366a39dd46f812ad1d348
    with:
      apps: ${{ needs.apps.outputs.apps }}
      destination: ${{ vars.OUTFITTER_URL || 'https://ai-outfitter.com' }}
