name: App releases
on:
  push:
    branches: [main]
permissions:
  contents: write
  issues: write
  pull-requests: write
jobs:
  release:
    if: vars.OUTFITTER_RELEASES_ENABLED == 'true'
    uses: ai-outfitter/apps/.github/workflows/release.yml@c00a16233a232e1d56a92f18960c3014dce5262d
    secrets:
      release-token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
