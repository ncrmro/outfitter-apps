name: Deployment
on:
  workflow_call:
    inputs:
      apps:
        required: true
        type: string
permissions:
  contents: read
  id-token: write
jobs:
  deploy:
    uses: ai-outfitter/apps/.github/workflows/deploy.yml@12f97d71314c70e7c974290958093f5a8cddd6a2
    with:
      apps: ${{ inputs.apps }}
      destination: ${{ vars.OUTFITTER_URL || 'https://ai-outfitter.com' }}
      environment: outfitter
      runner: ${{ vars.OUTFITTER_DEPLOY_RUNNER || 'ubuntu-latest' }}
